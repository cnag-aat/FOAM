# Example Snakemake >=8 profile for SLURM (pip install snakemake-executor-plugin-slurm).
# Use with: snakemake -s bin/foam.smk --configfile sp.foam.yaml --profile examples/profiles/slurm
executor: slurm
jobs: 20
use-conda: true
latency-wait: 60
default-resources:
  slurm_partition: general
  slurm_extra: "'--qos=normal'"
  mem_mb: 8000
  runtime: 120
set-resources:
  fish_reads:
    mem_mb: 32000
    runtime: 720
  flye_assembly:
    mem_mb: 64000
    runtime: 720
  polish:
    mem_mb: 32000
    runtime: 360
  annotate_prepolish:
    mem_mb: 16000
    runtime: 240
  annotate_final:
    mem_mb: 16000
    runtime: 240
