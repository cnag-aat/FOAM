# MITOS2 annotation + FOAM's annotate step (stdlib-only Python, 3.6 compatible).
# MITOS 2.1.3 matches the refseq81m/63m databases shipped in utils/refseq_dir.
# Bioconda MITOS needs viennarna<2, which is Linux-only.
# The command is runmitos.py in 2.1.3 and runmitos from 2.1.7 on (config: mitos.runmitos).
channels:
  - conda-forge
  - bioconda
dependencies:
  - mitos=2.1.3
  - minimap2>=2.24
